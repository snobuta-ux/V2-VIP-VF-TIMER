# VIP Vertical Farm — Timer Controller
#
# Every device is a GPIO pin wired to one channel of the 4-channel relay board.
# Pin numbers are BOARD numbers (the physical pin number on the Pi 4's 40-pin header).
#
# Relay board header  ->  Raspberry Pi 4
#   VCC               ->  pin 2  (5V)
#   GND               ->  pin 6  (GND)
#   IN1  (K1, far left)   ->  pin 11 (GPIO17)  pump
#   IN2  (K2)             ->  pin 13 (GPIO27)  fan   (disabled below until wired)
#   IN3  (K3)             ->  pin 15 (GPIO22)  spare
#   IN4  (K4, far right)  ->  pin 16 (GPIO23)  light
# Leave the JD-VCC jumper on the relay board in place.
# Times are the Pi's local time — set its timezone with:
#   sudo timedatectl set-timezone America/Indiana/Indianapolis
#
# Schedule types:
#   daily      on_time: "HH:MM", off_time: "HH:MM"               on between two times every day
#   interval   every_minutes, run_seconds, start_at: "HH:MM"     run N seconds every M minutes
#   times      at: ["HH:MM", ...], run_seconds                   run N seconds at fixed times
#   always_on
#   off
#
# After changing this file:  sudo systemctl restart vf-timer

relay:
  active_low: true      # most relay boards: pin LOW = relay ON. Set false if yours is reversed.

devices:
  light:
    pin: 16             # relay IN4 (K4, far right)
    schedule:
      type: daily
      on_time: "06:00"
      off_time: "22:00" # 16 h of light

  pump:
    pin: 11             # relay IN1 (K1, far left)
    max_run_seconds: 660 # safety cut-off: pump is never on longer than 11 min in one go
    schedule:
      type: times
      at: ["07:00", "12:00", "19:00"]  # morning, noon, night
      run_seconds: 600                 # pump stays on 10 minutes each time

  fan:
    enabled: false      # not wired yet - wire to relay IN2 and set to true
    pin: 13             # relay IN2 (K2)
    schedule:
      type: interval
      every_minutes: 30   # every 30 minutes...
      run_seconds: 600    # ...run for 10 minutes
      start_at: "00:00"

api:
  host: "0.0.0.0"
  port: 8080

# Logs everything to Firebase (Firestore): every light/pump/fan switch, manual
# overrides, safety cut-offs, warnings and errors, plus a status heartbeat.
# Needs firebase-credentials.json (service account key) in this folder.
# NEVER commit that file: it's in .gitignore.
firebase:
  enabled: true
  credentials_file: firebase-credentials.json
  device_id: farm2            # data goes to grows/farm2/... (farm 1 is grows/raspPi4)
  farm_name: "V2 timer farm"
  database_id: "(default)"    # or the ID of a separate Firestore database
  heartbeat_seconds: 60       # status update interval (60 s = 1440 writes/day)

# USB webcams: routine photos uploaded to Firebase.
#   plant      pointed at the plants
#   dashboard  pointed at the climate controller's display
# Plug both into any USB ports - they're found automatically. With device: auto
# the webcam on the lowest USB port is the plant camera and the next one is the
# dashboard camera. If they come out swapped, use "Swap cameras" on the website
# (or set device: to the USB port shown there, e.g. "1-1.2").
# Files: timer_farm2_2026-11-12_09-00-00.jpg (plant) and
#        timer_farm2_dashboard_2026-11-12_09-00-00.jpg (dashboard)
# They go to Firebase Storage grows/farm2/photos/ plus an info doc (with
# camera: plant|dashboard) in Firestore grows/farm2/photos. If the project has
# no Storage bucket, the photo is stored inside the Firestore doc instead.

camera:                       # settings shared by both webcams
  group: timer                # first part of every filename
  resolution: "1280x720"
  jpeg_quality: 85
  upload_to: auto             # auto | storage | firestore
  storage_bucket: ""          # blank = <project>.firebasestorage.app or <project>.appspot.com
  keep_days: 30               # local copies in data/photos/ are deleted after this

cameras:
  plant:
    enabled: true
    device: auto
    every_minutes: 60         # one photo an hour...
    start_at: "06:00"         # ...from 06:00
    end_at: "21:00"           # ...to 21:00 (16 photos a day)
    only_when_light_on: true  # skip photos while the grow light is off
  dashboard:
    enabled: true
    device: auto
    every_minutes: 60         # the display is lit day and night,
    start_at: "00:00"         # so photograph it every hour, all day
    end_at: "23:00"
    only_when_light_on: false

# Website remote control (grows/farm2/commands in Firestore): turn the light,
# pump and fan on/off, take photos, edit config.yaml and the code, pull updates
# from GitHub, restart. Needs Firebase. Set false to make the Pi ignore the website.
remote:
  enabled: true
  github_repo: "https://github.com/snobuta-ux/V2-VIP-VF-TIMER.git"
